<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GPC Smart Parking</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root{--bg:#0a0e1a;--panel:#0f1628;--border:#1e3a5f;--accent:#00d4ff;--accent2:#0077cc;--green:#00ff88;--red:#ff3355;--yellow:#ffd700;--text:#cce8ff;--dim:#5a7a99}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    #loginPage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:var(--bg)}
    .login-header{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,4vw,2.4rem);font-weight:900;color:var(--accent);text-align:center;letter-spacing:3px;margin-bottom:10px;animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{text-shadow:0 0 20px rgba(0,212,255,0.5)}50%{text-shadow:0 0 50px rgba(0,212,255,1),0 0 80px rgba(0,212,255,0.4)}}
    .login-sub{font-size:.85rem;color:var(--dim);letter-spacing:6px;text-transform:uppercase;margin-bottom:50px}
    .login-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:40px 50px;width:min(420px,90vw);position:relative;box-shadow:0 0 60px rgba(0,212,255,0.08)}
    .login-box::before{content:'';position:absolute;top:-1px;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
    .login-box h2{font-family:'Orbitron',monospace;font-size:1rem;color:var(--accent);text-align:center;letter-spacing:3px;margin-bottom:30px}
    .field-group{margin-bottom:22px}
    .field-group label{display:block;font-size:.8rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
    .field-group input{width:100%;background:rgba(0,212,255,0.04);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:600;letter-spacing:2px;outline:none;transition:all .3s}
    .field-group input:focus{border-color:var(--accent);background:rgba(0,212,255,0.08);box-shadow:0 0 20px rgba(0,212,255,0.15)}
    .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;border-radius:8px;color:#000;font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;letter-spacing:3px;cursor:pointer;margin-top:10px;transition:all .3s}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,255,0.4)}
    .error-msg{color:var(--red);font-size:.85rem;text-align:center;margin-top:14px;height:20px;letter-spacing:1px}
    #dashboard{display:none;min-height:100vh;flex-direction:column;position:relative;z-index:1}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 30px;height:64px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 4px 30px rgba(0,0,0,0.4)}
    .topbar-left{display:flex;align-items:center;gap:14px}
    .site-title{font-family:'Orbitron',monospace;font-size:clamp(.9rem,2.5vw,1.4rem);font-weight:900;color:var(--accent);letter-spacing:2px;text-shadow:0 0 20px rgba(0,212,255,0.5)}
    .topbar-right{display:flex;align-items:center;gap:14px}
    .user-badge{background:rgba(0,212,255,0.1);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:.8rem;color:var(--accent);letter-spacing:2px}
    .live-badge{display:flex;align-items:center;gap:6px;background:rgba(0,255,136,0.1);border:1px solid var(--green);border-radius:20px;padding:5px 14px;font-size:.75rem;color:var(--green);letter-spacing:2px;font-weight:700}
    .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1s ease-in-out infinite}
    .refresh-btn{display:flex;align-items:center;gap:8px;background:rgba(0,212,255,0.08);border:1px solid var(--accent);border-radius:8px;padding:8px 16px;color:var(--accent);font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .3s}
    .refresh-icon{display:inline-block;transition:transform .5s}
    .refresh-btn:hover .refresh-icon{transform:rotate(360deg)}
    .logout-btn{background:rgba(255,51,85,0.1);border:1px solid var(--red);border-radius:8px;padding:8px 14px;color:var(--red);font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .3s}
    .content{flex:1;padding:40px 20px;display:flex;flex-direction:column;align-items:center}
    .floor-title{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;color:var(--yellow);letter-spacing:4px;text-align:center;margin-bottom:8px;text-shadow:0 0 20px rgba(255,215,0,0.4)}
    .floor-desc{color:var(--dim);font-size:.8rem;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:40px}
    .slots-container{display:flex;flex-direction:column;gap:16px;width:min(600px,95vw)}
    .slot-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
    .slot-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;transition:background .3s}
    .slot-card.empty::before{background:var(--green)}
    .slot-card.filled::before{background:var(--red)}
    .slot-card:hover{transform:translateX(6px);border-color:rgba(0,212,255,0.4)}
    .slot-left{display:flex;align-items:center;gap:20px}
    .slot-number{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;color:var(--accent);min-width:70px}
    .slot-icon{font-size:1.8rem}
    .slot-label{font-size:1rem;color:var(--dim);letter-spacing:1px}
    .slot-badge{font-family:'Orbitron',monospace;font-size:.75rem;font-weight:700;letter-spacing:2px;padding:7px 18px;border-radius:20px;border:1.5px solid;transition:all .3s}
    .slot-card.empty .slot-badge{color:var(--green);border-color:var(--green);background:rgba(0,255,136,0.08);box-shadow:0 0 12px rgba(0,255,136,0.2)}
    .slot-card.filled .slot-badge{color:var(--red);border-color:var(--red);background:rgba(255,51,85,0.08);box-shadow:0 0 12px rgba(255,51,85,0.2)}
    .stats-bar{margin-top:40px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
    .stat-chip{background:var(--panel);border:1px solid var(--border);border-radius:50px;padding:10px 24px;display:flex;align-items:center;gap:10px;font-size:.9rem;letter-spacing:1px}
    .stat-dot{width:10px;height:10px;border-radius:50%;animation:blink 2s ease-in-out infinite}
    .stat-dot.green{background:var(--green);box-shadow:0 0 8px var(--green)}
    .stat-dot.red{background:var(--red);box-shadow:0 0 8px var(--red)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
    .stat-count{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700}
    .stat-label{color:var(--dim)}
    .timestamp{margin-top:30px;color:var(--dim);font-size:.78rem;letter-spacing:2px;text-align:center}
    .scan-line{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 4s linear infinite;opacity:.4;pointer-events:none;z-index:200}
    @keyframes scan{0%{top:0}100%{top:100vh}}
    .fade-in{animation:fadeIn .4s ease forwards}
    @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div class="scan-line"></div>
<div id="loginPage">
  <div class="login-header">🅿 GPC SMART PARKING</div>
  <div class="login-sub">Secure Access System</div>
  <div class="login-box">
    <h2>— LOGIN —</h2>
    <div class="field-group">
      <label>User ID</label>
      <input type="text" id="userId" placeholder="0001 / 0002 / 0003" maxlength="4"/>
    </div>
    <div class="field-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>
    <button class="login-btn" onclick="doLogin()">ACCESS SYSTEM</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <span style="font-size:1.6rem">🅿</span>
      <span class="site-title">GPC SMART PARKING</span>
    </div>
    <div class="topbar-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <span class="user-badge" id="userBadge">USER: 0001</span>
      <button class="refresh-btn" onclick="refreshData()"><span class="refresh-icon">↻</span> REFRESH</button>
      <button class="logout-btn" onclick="doLogout()">LOGOUT</button>
    </div>
  </div>
  <div class="content">
    <div class="floor-title">— FLOOR 1 —</div>
    <div class="floor-desc">Live Parking Status · Click Slot to Toggle</div>
    <div class="slots-container" id="slotsContainer">
      <div style="text-align:center;color:var(--dim);padding:40px;font-family:'Orbitron',monospace;font-size:.9rem;letter-spacing:2px;">LOADING...</div>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="timestamp" id="timestamp"></div>
  </div>
</div>
<script>
  const USERS={'0001':'gpc@123','0002':'gpc@123','0003':'gpc@123'};
  const firebaseConfig={databaseURL:"https://smart-parking-system-5b9fb-default-rtdb.asia-southeast1.firebasedatabase.app"};
  firebase.initializeApp(firebaseConfig);
  const db=firebase.database();
  let currentUser='';
  let slotsListener=null;
  function doLogin(){
    const uid=document.getElementById('userId').value.trim();
    const pwd=document.getElementById('password').value.trim();
    const err=document.getElementById('errorMsg');
    if(USERS[uid]&&USERS[uid]===pwd){
      err.textContent='';
      currentUser=uid;
      document.getElementById('loginPage').style.display='none';
      document.getElementById('dashboard').style.display='flex';
      document.getElementById('userBadge').textContent='USER: '+uid;
      startLiveListener();
    }else{
      err.textContent='✗  Invalid User ID or Password';
      document.getElementById('password').value='';
    }
  }
  document.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  function doLogout(){
    if(slotsListener){db.ref('/Floor1').off('value',slotsListener);slotsListener=null;}
    document.getElementById('loginPage').style.display='flex';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('userId').value='';
    document.getElementById('password').value='';
    document.getElementById('errorMsg').textContent='';
    currentUser='';
  }
  function startLiveListener(){
    db.ref('/Floor1').once('value',function(snapshot){
      if(!snapshot.exists()){
        const d={};
        for(let i=1;i<=5;i++)d['Slot'+i]='Empty';
        db.ref('/Floor1').set(d);
      }
    });
    slotsListener=db.ref('/Floor1').on('value',function(snapshot){
      const data=snapshot.val();
      if(data){renderSlots(data);updateTimestamp();}
    });
  }
  function toggleSlot(n){
    const ref=db.ref('/Floor1/Slot'+n);
    ref.once('value',function(s){
      ref.set(s.val()==='Empty'?'Filled':'Empty');
    });
  }
  function renderSlots(data){
    const c=document.getElementById('slotsContainer');
    c.innerHTML='';
    let empty=0,filled=0;
    for(let i=1;i<=5;i++){
      const status=data['Slot'+i]||'Empty';
      const isEmpty=status==='Empty';
      if(isEmpty)empty++;else filled++;
      const card=document.createElement('div');
      card.className=`slot-card ${isEmpty?'empty':'filled'} fade-in`;
      card.style.animationDelay=(i*0.07)+'s';
      card.onclick=()=>toggleSlot(i);
      card.innerHTML=`<div class="slot-left"><div class="slot-number">SLOT ${i}</div><div class="slot-icon">${isEmpty?'🟩':'🚗'}</div><div class="slot-label">${isEmpty?'Available':'Occupied'}</div></div><div class="slot-badge">${isEmpty?'✓ EMPTY':'✗ FILLED'}</div>`;
      c.appendChild(card);
    }
    document.getElementById('statsBar').innerHTML=`<div class="stat-chip"><div class="stat-dot green"></div><span class="stat-count">${empty}</span><span class="stat-label">Available</span></div><div class="stat-chip"><div class="stat-dot red"></div><span class="stat-count">${filled}</span><span class="stat-label">Occupied</span></div><div class="stat-chip"><span class="stat-count" style="color:var(--yellow)">5</span><span class="stat-label">Total Slots</span></div>`;
  }
  function refreshData(){
    const icon=document.querySelector('.refresh-icon');
    icon.style.transform='rotate(360deg)';
    setTimeout(()=>{icon.style.transform='';},500);
    updateTimestamp();
  }
  function updateTimestamp(){
    const now=new Date();
    document.getElementById('timestamp').textContent='Last Updated: '+now.toLocaleDateString('hi-IN')+' · '+now.toLocaleTimeString('hi-IN');
  }
</script>
</body>
</html>
